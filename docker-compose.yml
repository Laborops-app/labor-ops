# One-server stack: Caddy (HTTPS) -> web + api -> Postgres.
# Usage: copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laborops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: laborops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laborops -d laborops"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only the api container can reach it.

  # S3-compatible object storage for uploads and backups. Only the api container talks to it; the web console is
  # reachable from the server itself (ssh -L 9001:localhost:9001 <server>, then open http://localhost:9001).
  # Turned on by COMPOSE_PROFILES=storage in .env (with S3_ACCESS_KEY / S3_SECRET_KEY set).
  storage-perms:
    image: alpine:3.20
    profiles: ["storage"]
    user: root
    volumes:
      - rustfs_data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    profiles: ["storage"]
    restart: unless-stopped
    depends_on:
      storage-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: ["/data"]
    volumes:
      - rustfs_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_ADMIN_URL: postgres://laborops:${POSTGRES_PASSWORD}@db:5432/laborops
      DATABASE_URL: postgres://laborops_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/laborops
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LaborOps-Demo-1}
      # Encrypts the integration passwords saved on the Messaging page. Set once and never change it (falls back to JWT_SECRET).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      # Email (Amazon SES SMTP). Leave unset to run in log-only mode.
      SES_SMTP_HOST: ${SES_SMTP_HOST:-}
      SES_SMTP_PORT: ${SES_SMTP_PORT:-587}
      SES_SMTP_USER: ${SES_SMTP_USER:-}
      SES_SMTP_PASS: ${SES_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-LaborOps <no-reply@laborops.app>}
      # Text messages (Twilio). Leave unset to run in log-only mode.
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      SNS_REGION: ${SNS_REGION:-us-west-2}
      SNS_ACCESS_KEY_ID: ${SNS_ACCESS_KEY_ID:-}
      SNS_SECRET_ACCESS_KEY: ${SNS_SECRET_ACCESS_KEY:-}
      SNS_ORIGINATION_NUMBER: ${SNS_ORIGINATION_NUMBER:-}
      SNS_SENDER_ID: ${SNS_SENDER_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Object storage (RustFS above). A bucket each for chat files, documents and backups; created automatically.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET_CHAT: ${S3_BUCKET_CHAT:-laborops-chat}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-laborops-documents}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-laborops-backups}
      # Optional: send backups to a different S3 server (another machine, or AWS S3 / Backblaze / Wasabi) so they
      # survive losing this one. Blank = the RustFS above.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUPS_ENABLED: ${BACKUPS_ENABLED:-true}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-9}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      # Comma-separated emails of company admins who may see storage and backup status (Integrations page).
      PLATFORM_ADMINS: ${PLATFORM_ADMINS:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  rustfs_data:
  caddy_data:
  caddy_config:
