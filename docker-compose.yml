# One-server stack: Caddy (HTTPS) -> web + api -> Postgres.
# Usage: copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laborops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: laborops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laborops -d laborops"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only the api container can reach it.

  # S3-compatible object storage (RustFS) for uploads and backups. Nothing to configure: on first start the init step
  # below generates its access keys into a private volume that only RustFS and the api can read. Storage, buckets and
  # backups are then managed on the Platform page. The RustFS console is reachable from the server itself only
  # (ssh -L 9001:localhost:9001 <server>, then http://localhost:9001; the keys are in the rustfs_keys volume).
  storage-init:
    image: alpine:3.20
    user: root
    volumes:
      - rustfs_data:/data
      - rustfs_keys:/keys
    command:
      - sh
      - -c
      - |
        set -e
        [ -s /keys/access ] || head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n' > /keys/access
        [ -s /keys/secret ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /keys/secret
        chmod 444 /keys/access /keys/secret
        chown -R 10001:10001 /data

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c", "export RUSTFS_ACCESS_KEY=\"$$(cat /keys/access)\" RUSTFS_SECRET_KEY=\"$$(cat /keys/secret)\"; exec /entrypoint.sh /data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs_data:/data
      - rustfs_keys:/keys:ro
    ports:
      - "127.0.0.1:9001:9001"

  api:
    image: laborops-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The built-in RustFS's generated keys (read-only), so the app can use it with no setup.
      - rustfs_keys:/run/rustfs-keys:ro
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_ADMIN_URL: postgres://laborops:${POSTGRES_PASSWORD}@db:5432/laborops
      DATABASE_URL: postgres://laborops_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/laborops
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LaborOps-Demo-1}
      # Encrypts the integration passwords saved on the Messaging page. Set once and never change it (falls back to JWT_SECRET).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      # Email (Amazon SES SMTP). Leave unset to run in log-only mode.
      SES_SMTP_HOST: ${SES_SMTP_HOST:-}
      SES_SMTP_PORT: ${SES_SMTP_PORT:-587}
      SES_SMTP_USER: ${SES_SMTP_USER:-}
      SES_SMTP_PASS: ${SES_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-LaborOps <no-reply@laborops.app>}
      # Text messages through Zernio. Leave unset to run in log-only mode (companies can add their own key in the app).
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_FROM: ${ZERNIO_FROM:-}
      # Object storage and backups are set on the Platform page. These only matter if you prefer configuring by hand;
      # left blank, the built-in RustFS above is used automatically.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      # Address of the platform console (its own subdomain). Used in the setup links it hands out.
      PLATFORM_URL: https://${PLATFORM_DOMAIN:-sysadmin.laborops.app}

  web:
    image: laborops-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  # ---------- Public demo (demoapp.laborops.app) ----------
  # Started on demand by the demo gate, wiped and restarted every 2 hours, stopped after an hour with nobody using it.
  # It has its own throwaway database (in memory) and never sends real email or texts.
  demo-gate:
    build: ./infra/demo-gate
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-laborops}
      PROJECT_DIR: /project
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LaborOps-Demo-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro

  demo-db:
    image: postgres:16-alpine
    profiles: ["demo"]
    environment:
      POSTGRES_USER: laborops
      POSTGRES_PASSWORD: demo-only
      POSTGRES_DB: laborops
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laborops -d laborops"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-api:
    image: laborops-api:latest
    profiles: ["demo"]
    depends_on:
      demo-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_ADMIN_URL: postgres://laborops:demo-only@demo-db:5432/laborops
      DATABASE_URL: postgres://laborops_app:demo-only-app@demo-db:5432/laborops
      APP_DB_PASSWORD: demo-only-app
      JWT_SECRET: demo-${JWT_SECRET}
      SETTINGS_ENCRYPTION_KEY: demo-${JWT_SECRET}
      COOKIE_SECURE: "true"
      SEED_DEMO: "true"
      DEMO_BIG: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LaborOps-Demo-1}
      APP_URL: https://${DEMO_DOMAIN:-demoapp.laborops.app}
      PLATFORM_URL: https://${DEMO_DOMAIN:-demoapp.laborops.app}
      BACKUPS_ENABLED: "false"
      # No email or text providers: messages are only logged.

  demo-web:
    image: laborops-web:latest
    profiles: ["demo"]
    depends_on:
      - demo-api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - demo-gate
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-sysadmin.laborops.app}
      SITE_DOMAIN: ${SITE_DOMAIN:-laborops.app}
      DEMO_DOMAIN: ${DEMO_DOMAIN:-demoapp.laborops.app}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  rustfs_data:
  rustfs_keys:
  caddy_data:
  caddy_config:
