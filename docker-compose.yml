# One-server stack: Caddy (HTTPS) -> web + api -> Postgres.
# Usage: copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laborops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: laborops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laborops -d laborops"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only the api container can reach it.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_ADMIN_URL: postgres://laborops:${POSTGRES_PASSWORD}@db:5432/laborops
      DATABASE_URL: postgres://laborops_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/laborops
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LaborOps-Demo-1}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      # Email (Amazon SES SMTP). Leave unset to run in log-only mode.
      SES_SMTP_HOST: ${SES_SMTP_HOST:-}
      SES_SMTP_PORT: ${SES_SMTP_PORT:-587}
      SES_SMTP_USER: ${SES_SMTP_USER:-}
      SES_SMTP_PASS: ${SES_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-LaborOps <no-reply@laborops.app>}
      # Text messages (Twilio). Leave unset to run in log-only mode.
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      SNS_REGION: ${SNS_REGION:-us-west-2}
      SNS_ACCESS_KEY_ID: ${SNS_ACCESS_KEY_ID:-}
      SNS_SECRET_ACCESS_KEY: ${SNS_SECRET_ACCESS_KEY:-}
      SNS_ORIGINATION_NUMBER: ${SNS_ORIGINATION_NUMBER:-}
      SNS_SENDER_ID: ${SNS_SENDER_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
